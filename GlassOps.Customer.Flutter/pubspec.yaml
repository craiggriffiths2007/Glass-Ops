name: glassops_customer_flutter
description: Glass Ops customer repair tracking app, converted from MAUI Blazor Hybrid.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/demo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/appicon.png
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: assets/branding/appicon.png
